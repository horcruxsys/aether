name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint & Format
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint format:check

  type-check:
    runs-on: ubuntu-latest
    name: Type Check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo check-types

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
      - uses: astral-sh/setup-uv@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      - run: pnpm turbo test -- --coverage
      - run: cd apps/refinery-core && cargo test
      - run: cd packages/entity-resolution && uv run pytest
      - run: cd packages/schema-discovery && uv run pytest
      - run: cd packages/sync-engine && uv run pytest

  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests
    services:
      docker:
        image: docker:latest
        options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - uses: docker/setup-buildx-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      - run: docker-compose up -d --wait
      - run: pnpm turbo run integration
      - run: docker-compose logs
        if: failure()
      - run: docker-compose down
        if: always()

  build:
    runs-on: ubuntu-latest
    name: Build Artifacts
    if: github.event_name == 'push'
    needs: [lint, type-check, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - uses: docker/setup-buildx-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      - name: Build Docker images (dry-run)
        run: |
          docker buildx build --dry-run -f apps/gateway-api/Dockerfile .
          docker buildx build --dry-run -f apps/nexus-manager/Dockerfile .
