[project]
name = "aether-schema-discovery"
version = "0.1.0"
description = "MinHash + LSH schema alignment engine for Aether Data Fabric"
authors = [
    { name = "Aether Contributors" }
]
dependencies = [
    "networkx>=3.0",
]
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_schema"]
