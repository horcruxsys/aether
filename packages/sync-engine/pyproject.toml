[project]
name = "aether-sync-engine"
version = "0.1.0"
description = "Merkle Tree-based incremental sync engine for Aether Data Fabric"
authors = [
    { name = "Aether Contributors" }
]
dependencies = []
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_sync"]
